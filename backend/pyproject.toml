[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "seoheejeong",email = "septemsun@naver.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "pymysql[rsa] (>=1.2.0,<2.0.0)",
    "python-ulid (>=4.0.1,<5.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "feedparser (>=6.0.14,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "tzdata (>=2026.3,<2027.0)"
]


[tool.poetry]
# 배포용 패키지가 아니라 애플리케이션이다. 이 줄이 없으면 poetry install이
# backend 패키지를 찾다가 실패한다 (docs/README.md의 설치 절차, SR-N-403).
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
