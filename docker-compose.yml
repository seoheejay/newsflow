services:
  db:
    image: mysql:8.4
    container_name: newsflow-db
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: newsflow
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: newsflow-redis
    ports:
      - "6379:6379"

volumes:
  db_data: